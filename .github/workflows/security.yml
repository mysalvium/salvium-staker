name: Security and reproducibility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate source and security policy
        run: |
          bash -n ./*.sh scripts/*.sh
          shellcheck ./*.sh scripts/*.sh
          sh tests/test_acl_safety.sh
          docker compose --env-file .env.example config --quiet
          ./scripts/check-repo-safety.sh
          ./scripts/validate-hardening.sh .env.example

      - name: Test orchestrator logic
        run: |
          python -m pip install --disable-pip-version-check -r orchestrator/requirements.txt
          python -m unittest discover -s tests -v

      - name: Build checksum-verified images
        run: ./build-images.sh

      - name: Verify both official architecture downloads
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./scripts/verify-downloads.sh --all

      - name: Scan source and images; generate SBOMs
        run: ./scripts/security-scan.sh .env.example full

      - name: Preserve security reports and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-reports
          path: .security-reports/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
